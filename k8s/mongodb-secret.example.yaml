# Copy to k8s/mongodb-secret.yaml, put in your own MongoDB Atlas URI, and apply.
# k8s/mongodb-secret.yaml is ignored by git.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: cld-final
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/?retryWrites=true&w=majority"
