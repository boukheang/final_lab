# TASK 3 - exactly two Pods for Minikube.
# Pod 1 runs the API Gateway and Registration containers (shared localhost).
# Pod 2 runs the Delete Student container.
apiVersion: v1
kind: Pod
metadata:
  name: pod-1-gateway-registration
  namespace: cld-final
  labels:
    app: cld-final
    tier: gateway-registration
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: registration
      image: cld-registration:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: registration
          containerPort: 5001
      env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "5001"
        - name: MONGODB_DB
          value: CLD_Final
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGODB_URI
      readinessProbe:
        httpGet:
          path: /health
          port: 5001
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /health
          port: 5001
        initialDelaySeconds: 30
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 256Mi

    - name: api-gateway
      image: cld-api-gateway:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: gateway
          containerPort: 4000
      env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "4000"
        # Same Pod => registration is reachable on localhost.
        - name: REGISTRATION_URL
          value: http://127.0.0.1:5001
        # Different Pod => use the Delete Student ClusterIP Service.
        - name: DELETE_SERVICE_URL
          value: http://delete-student-service:5002
      readinessProbe:
        httpGet:
          path: /health
          port: 4000
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /health
          port: 4000
        initialDelaySeconds: 30
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-2-delete-student
  namespace: cld-final
  labels:
    app: cld-final
    tier: delete-student
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: delete-student
      image: cld-delete-student:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - name: delete
          containerPort: 5002
      env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "5002"
        - name: MONGODB_DB
          value: CLD_Final
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGODB_URI
      readinessProbe:
        httpGet:
          path: /health
          port: 5002
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /health
          port: 5002
        initialDelaySeconds: 30
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 256Mi
